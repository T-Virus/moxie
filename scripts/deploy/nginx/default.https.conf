# =============================================================================
# nginx/default.https.conf — TLS 版 Web 网关（生产推荐）
#
# 启用方式：
#   1) 在 server/nginx/certs/ 放入证书：fullchain.pem、privkey.pem
#      （certbot 申请示例见 INSTALL.md）
#   2) 把本文件改名覆盖 default.conf：
#        mv nginx/default.https.conf nginx/default.conf
#   3) 放通安全组 443 端口，重启：docker compose ... up -d nginx
#
# 作用：HTTP 全量 301 跳转到 HTTPS；443 提供前端 + 反代；关闭明文 80 上的 API。
# 证书路径与 docker-compose.web.yml 的挂载 ../nginx/certs -> /usr/share/nginx/certs 对应。
# =============================================================================

upstream moxie_api {
    server api:8000;
}

# HTTP -> HTTPS 重定向（含 HSTS，强制浏览器只走 HTTPS）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /usr/share/nginx/certs/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：告诉浏览器之后只用 HTTPS（首次仍可能明文，故配合 301 跳转）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location ~ ^/(v1|healthz|docs|openapi\.json|redoc|metrics|static|uploads|downloads) {
        proxy_pass http://moxie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
