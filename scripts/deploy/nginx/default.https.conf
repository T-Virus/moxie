# =============================================================================
# nginx/default.https.conf — TLS 版 Web 网关（生产推荐）
#
# 启用方式：
#   1) 在 server/nginx/certs/ 放入证书：fullchain.pem、privkey.pem
#      （certbot 申请示例见 INSTALL.md）
#   2) 把本文件改名覆盖 default.conf：
#        mv nginx/default.https.conf nginx/default.conf
#   3) 放通安全组 443 端口，重启：docker compose ... up -d nginx
#
# 作用：HTTP 全量 301 跳转到 HTTPS；443 提供前端 + 反代；关闭明文 80 上的 API。
# 证书路径与 docker-compose.web.yml 的挂载 ../nginx/certs -> /usr/share/nginx/certs 对应。
# =============================================================================

upstream moxie_api {
    server api:8000;
}

# API 路径的 CSP 交由 FastAPI 中间件决定；其余（前端 HTML/静态资源）由 nginx 下发严格 CSP。
# 值为空时 nginx 不发该头，避免与 FastAPI 对 /docs 的宽松策略冲突。
map $uri $moxie_https_csp {
    default                                            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(v1|healthz|readyz|docs|redoc|openapi\.json|metrics)(/|$)  "";
}

# HTTP -> HTTPS 重定向（含 HSTS，强制浏览器只走 HTTPS）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /usr/share/nginx/certs/fullchain.pem;
    ssl_certificate_key /usr/share/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：告诉浏览器之后只用 HTTPS（首次仍可能明文，故配合 301 跳转）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 其余安全头（含严格 CSP），静态 HTML 不经 FastAPI，必须在此下发。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy $moxie_https_csp always;

    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location ~ ^/(v1|healthz|readyz|docs|openapi\.json|redoc|metrics|static|uploads|downloads) {
        proxy_pass http://moxie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：客户端自带的 XFF 不可信；后端 trust_proxy=true 时只信任这里写入的直连 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 离线安装包：默认 1m 会 413 / 断连，与后端 offline_package_max_bytes 保持一致
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 此 location 有自己的 add_header，父级 add_header 不继承，需重新声明安全头。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $moxie_https_csp always;
    }
}
