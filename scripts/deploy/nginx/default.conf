# =============================================================================
# nginx/default.conf — 随 docker-compose 一起运行的 Web 网关
#
# 由 server/docker-compose.yml 的 nginx 服务挂载为 /etc/nginx/conf.d/default.conf：
#   client/dist -> 站点根路径 /
#   admin/dist  -> /admin
#   /v1 /healthz /docs /openapi.json /redoc /metrics /static /uploads /downloads
#                -> 反代到后端 api 容器（同 compose 网络，服务名 api:8000）
#
# 说明：
#   - client / admin 都用同源 /v1 调用接口，故统一反代 /v1 即可。
#   - SSE / 流式响应关闭缓冲（proxy_buffering off）。
#   - 若脱离 compose 单独跑 nginx（连宿主 127.0.0.1:8000），把 upstream 改回 127.0.0.1:8000。
# =============================================================================

upstream moxie_api {
    server api:8000;
}

# API 路径的 CSP 交由 FastAPI 中间件决定（/docs 需要内联脚本，用宽松策略）；
# 其余（前端 HTML/静态资源）由 nginx 下发严格 CSP。值为空时 nginx 不发该头。
map $uri $moxie_csp {
    default                                            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(v1|healthz|readyz|docs|redoc|openapi\.json|metrics)(/|$)  "";
}

server {
    listen 80;
    server_name _;

    # 统一安全响应头。静态 HTML 由 nginx 直接返回，不经 FastAPI，因此 CSP 必须在这里下发。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy $moxie_csp always;

    # 客户端前端（client/dist）根路径
    root /usr/share/nginx/html;
    index index.html;

    # 管理端前端（admin/dist）挂到 /admin（SPA history 回退到 /admin/index.html）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端接口与资源反代（按需增删前缀）
    location ~ ^/(v1|healthz|readyz|docs|openapi\.json|redoc|metrics|static|uploads|downloads) {
        proxy_pass http://moxie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：客户端自带的 XFF 不可信；后端 trust_proxy=true 时只信任这里写入的直连 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # 支持 SSE / 流式
        # 离线安装包：nginx 默认 client_max_body_size 仅 1m，会直接 413 / 断连；
        # 这里与后端 offline_package_max_bytes 默认值（2GiB）保持一致，改了后端上限记得同步。
        client_max_body_size 2g;
        proxy_request_buffering off;  # 边收边转，不把整包先落 nginx 临时盘
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 客户端 SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存。注意：此 location 一旦有自己的 add_header，父级 add_header 全部不继承，
    # 必须在这里重新声明安全头，否则 js/css 响应会丢失 CSP。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $moxie_csp always;
    }
}
