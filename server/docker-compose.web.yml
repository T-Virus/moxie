# =============================================================================
# docker-compose.web.yml — Web 网关覆盖文件（仅线上 / ECS 使用）
#
# 与 docker-compose.yml 叠加使用，二者位于同一目录、共享默认项目网络，
# 因此本文件的 nginx 可直接用服务名 api 访问后端：
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up -d --build
#
# 本地 start_online.bat 只加载 docker-compose.yml，不会启动 nginx。
#
# 挂载路径相对本文件所在目录（server/）：
#   ../client/dist -> /usr/share/nginx/html          （站点根 /）
#   ../admin/dist  -> /usr/share/nginx/html/admin     （/admin）
#   ../nginx/default.conf -> /etc/nginx/conf.d/default.conf
#   ../nginx/certs  -> /usr/share/nginx/certs:ro      （HTTPS 证书，缺失不影响 HTTP 运行）
#
# 开启 HTTPS：把 ../nginx/default.https.conf 改名为 default.conf，并在 ../nginx/certs/
# 放入 fullchain.pem + privkey.pem，再放通 443 端口、重启 nginx 即可。
# =============================================================================

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_SSL_PORT:-443}:443"
    volumes:
      - ../client/dist:/usr/share/nginx/html:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/usr/share/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
